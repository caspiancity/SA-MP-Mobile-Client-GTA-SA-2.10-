name: Build SA-MP Mobile Client

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fix permissions for Gradlew
        run: |
          find . -maxdepth 2 -iname "gradlew" -exec chmod +x {} \;

      - name: Build Debug APK
        run: |
          # Ninja / CMake üçün RAM dolmasının qarşısını almaq üçün parallel yiv sayını 2 ilə məhdudlaşdırırıq
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ -f "./Gradlew" ]; then
            ./Gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samp-client-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
