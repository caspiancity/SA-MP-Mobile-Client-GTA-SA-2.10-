name: Build SA-MP Mobile Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & NDK 23b
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          packages: 'ndk;23.2.8568313'

      - name: Set NDK Environment Variables
        run: |
          NDK_PATH="${ANDROID_HOME}/ndk/23.2.8568313"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> $GITHUB_ENV

      - name: Auto-Fix Header Case Sensitivity & Missing Includes
        run: |
          cat << 'EOF' > fix_headers.py
          import os
          import re

          repo_root = os.getcwd()
          cpp_dir = os.path.join(repo_root, 'app/src/main/cpp')

          if not os.path.exists(cpp_dir):
              print(f"C++ qovluğu tapılmadı: {cpp_dir}")
              exit(0)

          # 1. CMakeLists.txt fayllarına include yollarını əlavə edirik
          for root, dirs, files in os.walk(cpp_dir):
              if 'CMakeLists.txt' in files:
                  cm_path = os.path.join(root, 'CMakeLists.txt')
                  try:
                      with open(cm_path, 'r', encoding='utf-8', errors='ignore') as cm_file:
                          cm_content = cm_file.read()
                      inc_line = '\ninclude_directories("${CMAKE_CURRENT_SOURCE_DIR}")\ninclude_directories("${CMAKE_CURRENT_SOURCE_DIR}/..")\ninclude_directories("${CMAKE_CURRENT_SOURCE_DIR}/../..")\n'
                      if 'include_directories("${CMAKE_CURRENT_SOURCE_DIR}")' not in cm_content:
                          with open(cm_path, 'w', encoding='utf-8') as cm_file:
                              cm_file.write(inc_line + cm_content)
                  except Exception:
                      pass

          # 2. Bütün faylların xəritəsini çıxarırıq
          file_map = {}
          for root, dirs, files in os.walk(cpp_dir):
              for f in files:
                  full_p = os.path.join(root, f)
                  rel_p = os.path.relpath(full_p, cpp_dir).replace('\\', '/')
                  file_map[rel_p.lower()] = rel_p
                  file_map[f.lower()] = f

          include_regex = re.compile(r'(#\s*include\s*["<])([^">]+)([">])')

          # 3. Faylların içini düzəldirik
          fixed_count = 0
          for root, dirs, files in os.walk(cpp_dir):
              for f in files:
                  if f.endswith(('.h', '.hpp', '.c', '.cpp', '.cc', '.inl')):
                      filepath = os.path.join(root, f)
                      try:
                          with open(filepath, 'r', encoding='utf-8', errors='ignore') as fp:
                              content = fp.read()

                          def fix_inc(m):
                              p1, inc_path, p2 = m.groups()
                              clean_inc = inc_path.replace('\\', '/')
                              fname_lower = os.path.basename(clean_inc).lower()
                              
                              # Əvvəlcə tam yola baxırıq
                              if clean_inc.lower() in file_map:
                                  return f'{p1}{file_map[clean_inc.lower()]}{p2}'
                              # Sonra sadəcə fayl adına baxırıq
                              elif fname_lower in file_map:
                                  real_filename = file_map[fname_lower]
                                  dirname = os.path.dirname(clean_inc)
                                  new_path = f'{dirname}/{real_filename}' if dirname else real_filename
                                  return f'{p1}{new_path}{p2}'
                              return m.group(0)

                          new_content = include_regex.sub(fix_inc, content)

                          # 4. ƏSKİK OLAN RGBA.h XƏTASI ÜÇÜN XÜSUSİ HƏLL
                          if f in ['TextRasterizer.h', 'ColouredText.h']:
                              if 'rgba.h' not in new_content.lower():
                                  real_rgba = file_map.get('rgba.h', 'RGBA.h')
                                  new_content = f'#include "{real_rgba}"\n' + new_content

                          if new_content != content:
                              with open(filepath, 'w', encoding='utf-8') as fp:
                                  fp.write(new_content)
                              fixed_count += 1
                      except Exception:
                          pass

          print(f"Hərfləri və daxiletmələri düzəldilmiş fayl sayısı: {fixed_count}")
          EOF
          python3 fix_headers.py

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          if ! ./gradlew assembleDebug --stacktrace --info > build_output.log 2>&1; then
            echo "=========================================="
            echo "❌ BUILD ÇÖKDÜ! İŞTƏ ƏSAS XƏTALAR (ERRORS):"
            echo "=========================================="
            grep -i -E "error:|fatal:|FAILED" build_output.log -B 2 -A 4 | head -n 150 || true
            echo "=========================================="
            echo "=== LOGUN SON 100 SƏTRİ ==="
            tail -n 100 build_output.log
            exit 1
          fi

      - name: Upload APK Output
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Client-v2.10-Debug
          path: app/build/outputs/apk/debug/*.apk
```eof

Bu dəfə sintaksis xətası (YAML parsing error) olmayacaq, çünki Python kodu təhlükəsiz şəkildə faylın içində yaradılıb icra edilir. Push edib yoxla, nəhayət o xətaları keçəcəyik!
